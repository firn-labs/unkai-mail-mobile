# Configuration for `cargo audit`. It lives in `.cargo/` because that is
# where cargo-audit looks — at the repository root it was never read, so
# a local `cargo audit` reported the accepted advisories as new.
#
# Each ID listed below is an advisory we are *intentionally* accepting
# because the affected crate is pulled in transitively by an upstream we
# cannot upgrade past.  Revisit this list whenever upstream releases land
# — the goal is to keep it shrinking.
#
# Keep in sync with `deny.toml`, `osv-scanner.toml` and the `ignore:`
# input of the audit job in `.github/workflows/ci.yml` (the
# rustsec/audit-check action reads no config file).

[advisories]
ignore = [
  # ── Linux-only desktop stacks Tauri carries along ───────────────
  # Tauri's Linux backends (muda → gtk → glib; tauri-plugin-notification
  # and -opener → zbus) stay in Cargo.lock but are never compiled for
  # iOS.
  "RUSTSEC-2024-0429", # glib (unsound iterator impls)
  "RUSTSEC-2024-0370", # proc-macro-error (unmaintained, via glib-macros)
  "RUSTSEC-2026-0370", # zvariant (unmaintained)
  "RUSTSEC-2026-0371", # zbus_names (unmaintained)
  "RUSTSEC-2026-0372", # zvariant_derive (unmaintained)

  # ── Other transitive unmaintained deps ───────────────────────────
  # async-imap 0.12 is the newest release and still defaults to its
  # async-std runtime, which brings both along.
  "RUSTSEC-2025-0052", # async-std (unmaintained, via async-imap)
  "RUSTSEC-2026-0441", # pin-utils (unmaintained, via async-imap / async-std)

  # ── pgp's RSA / elliptic-curve stack ─────────────────────────────
  # `rsa` (CVE-2023-49092, Marvin) has no patched release upstream, and
  # `crypto-bigint` is fixed only in 0.7 while every `pgp` release up
  # to 0.21 is built on elliptic-curve 0.13 → crypto-bigint 0.5.  Both
  # are timing side channels: they need an attacker who can measure
  # many decryptions or signatures, which our local, offline PGP use
  # never exposes to a remote party.
  "RUSTSEC-2023-0071", # rsa (Marvin)
  "RUSTSEC-2026-0387", # crypto-bigint (timing variability)

  # ── SQLite CVE-2026-119375 in the bundled SQLCipher ──────────────
  # A database opened together with a crafted `-wal` of another page
  # size can return stale process memory.  Upgrading does NOT fix our
  # build: libsqlite3-sys 0.39 counts as patched only for plain
  # `bundled`; its `bundled-sqlcipher` path pins sqlcipher-src
  # =419.0.6 (SQLite 3.53.4, still affected).  The fixed SQLCipher
  # (sqlcipher-src 420, SQLite 3.54.1) is in no rusqlite release yet,
  # so moving to rusqlite 0.41 would only quiet the scanners.
  # Exposure here: the attacker must plant files inside the app's own
  # sandbox (profiles/<id>/cache.db + -wal), and only this process
  # reads the result.  REVISIT when libsqlite3-sys moves to
  # sqlcipher-src >= 420 — then upgrade rusqlite and drop this entry.
  "RUSTSEC-2026-0459", # libsqlite3-sys (bundled SQLCipher)
]
