# Configuration for Google's OSV-Scanner.
#
# Mirrors the ignore list in `.cargo/audit.toml` (cargo-audit) and the
# `[advisories.ignore]` block in `deny.toml` (cargo-deny).  The
# three sources need to stay in sync — every advisory we accept is
# upstream-blocked: a transitive dep we can't bump until its own
# maintainers cut a release.

# ── Linux-only desktop stacks Tauri carries along ──────────────
[[IgnoredVulns]]
id = "RUSTSEC-2024-0429"
reason = "glib unsoundness — transitive via Tauri's Linux GTK3 backend (muda → gtk → glib); never compiled for iOS"
[[IgnoredVulns]]
id = "RUSTSEC-2024-0370"
reason = "proc-macro-error unmaintained — transitive build-time dep of glib-macros (Linux only)"
[[IgnoredVulns]]
id = "RUSTSEC-2026-0370"
reason = "zvariant unmaintained — transitive via zbus in the Linux backends of tauri-plugin-notification / -opener; never compiled for iOS"
[[IgnoredVulns]]
id = "RUSTSEC-2026-0371"
reason = "zbus_names unmaintained — transitive via zbus in the Linux backends of tauri-plugin-notification / -opener; never compiled for iOS"
[[IgnoredVulns]]
id = "RUSTSEC-2026-0372"
reason = "zvariant_derive unmaintained — transitive via zbus in the Linux backends of tauri-plugin-notification / -opener; never compiled for iOS"

# ── Other transitive unmaintained deps ───────────────────────────
[[IgnoredVulns]]
id = "RUSTSEC-2025-0052"
reason = "async-std unmaintained — transitive via async-imap 0.11"

# ── pgp's RSA / elliptic-curve stack (transitive via pgp) ────────
[[IgnoredVulns]]
id = "RUSTSEC-2023-0071"
reason = "rsa Marvin attack (CVE-2023-49092) — no patched release exists upstream; pulled in via pgp → unkai-crypto. The attack needs an adaptive decryption-timing oracle, which our offline local PGP decryption does not expose to a remote attacker."
[[IgnoredVulns]]
id = "RUSTSEC-2026-0387"
reason = "crypto-bigint 0.5 timing variability — via pgp's elliptic-curve 0.13 stack; fixed only in 0.7, which no pgp release (0.21 included) uses yet. Same local-timing-oracle argument as rsa."

# ── RustCrypto's previous generation (transitive via pgp) ────────
[[IgnoredVulns]]
id = "GHSA-qwgh-2vcv-g2f7"
reason = "block-buffer 0.10 cursor corruption after a *caught* panic in a compress callback — fixed only in 0.12.1 (already in the tree for the current RustCrypto stack); 0.10.4 is the last of its line and is reached through digest 0.10 under pgp. Exploiting it needs code that catches a panic from inside a hash and keeps using the hasher, which nothing here does."

# ── npm, build-time only ─────────────────────────────────────────
[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4"
reason = "deepmerge prototype poisoning (low) — no patched release; reached only via @sveltejs/vite-plugin-svelte at build time, merging our own Vite/Svelte config objects. Nothing of it ships in the bundle."
