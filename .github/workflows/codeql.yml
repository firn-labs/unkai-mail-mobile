name: CodeQL

# CodeQL is GitHub's static-analysis scanner.  It looks for
# injection patterns, dangerous APIs, hardcoded credentials,
# unsafe deserialisation, path-traversal — the kind of thing
# `clippy` and `eslint` don't catch because they're linters,
# not security analysers.  Findings appear in the "Security"
# tab of the repo (Code scanning alerts).
#
# We scan two languages:
#   * `javascript-typescript` — covers our Svelte / TS frontend
#     and any JS in node_modules-imported tooling.
#   * `rust` — CodeQL added Rust support in 2024 (still in
#     beta but already useful for the obvious patterns).

on:
  # Triggered from `release.yml` (gates the installer build) and
  # from `weekly-security.yml` (the cron tick).  No push / PR
  # triggers — daily dev gets the cheap `smoke.yml` instead.
  workflow_call:
  workflow_dispatch:
  schedule:
    # Independent weekly cron so the Security tab keeps fresh data
    # even if no release tag was cut.  Sunday 03:00 UTC avoids
    # the weekday peak.
    - cron: "0 3 * * 0"

jobs:
  analyse:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      # Required to upload SARIF results to the Security tab.
      security-events: write
      # Required to read the contents of the repository.
      contents: read
      # Required to resolve workflow caches.
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, rust]

    env:
      # The Rust extractor (rust-analyzer underneath) turns `cfg(test)`
      # ON by default, so every inline `#[cfg(test)] mod tests` was
      # analysed as if it shipped — its fixture keys, test certs and
      # assert messages raised a dozen alerts on code no build of the
      # app contains.  `-test` analyses what ships, which is what
      # `paths-ignore` already does for the `tests/` directories.
      # Read by the Rust extractor only; the JS leg ignores it.
      CODEQL_EXTRACTOR_RUST_OPTION_CARGO_CFG_OVERRIDES: "-test"

    steps:
      - uses: actions/checkout@v7

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4.39.0
        with:
          languages: ${{ matrix.language }}
          # See `.github/codeql/codeql-config.yml` for the path
          # exclusions (test fixtures, generated assets) and the
          # `security-extended` query pack.
          config-file: ./.github/codeql/codeql-config.yml

      # CodeQL needs to *see* compiled code for compiled languages.
      # For Rust we let its autobuild step run cargo for us.
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.39.0

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v4.39.0
        with:
          category: "/language:${{ matrix.language }}"
