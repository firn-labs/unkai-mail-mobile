name: Semgrep

# Semgrep is a fast pattern-based static analyser that complements
# CodeQL.  Where CodeQL does deep dataflow analysis, Semgrep is
# good for pattern-style rules: "no `eval` here", "every call to
# this function must pass through `validate()` first", etc.
#
# We run the official `p/security-audit` ruleset (curated security
# patterns), plus the Rust- and TypeScript-specific packs.  These
# are public rule packs distributed by Semgrep — no account or
# token required.  The Semgrep CLI itself is LGPL-2.1, free for
# any usage including commercial / sold downstream apps.

on:
  # Triggered from `release.yml` and `weekly-security.yml`; daily
  # dev uses `smoke.yml` instead.
  workflow_call:
  workflow_dispatch:
  schedule:
    # Independent weekly cron so newly-published rule patterns hit
    # the codebase even when no release tag was cut.
    - cron: "0 5 * * 1"

permissions:
  contents: read
  # SARIF upload to the Security tab.
  security-events: write

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    # Skip the scheduled run on forks to save CI minutes — the
    # Security tab on the upstream repo is the authoritative view.
    if: (github.actor != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@v7
      - name: Run Semgrep
        # `--config p/security-audit` is the cross-language default
        # security pack.  We add the Rust + TS-specific packs on
        # top.  `--sarif` writes findings in the GitHub-Code-Scanning
        # format so they appear in the Security tab.  No `--error`:
        # the next step is the gate, because it alone knows which
        # findings were already reviewed.
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/rust \
            --config p/typescript \
            --sarif --output=semgrep-raw.sarif \
            --metrics=off
      - name: Drop reviewed findings, fail on the rest
        # Honours `// nosemgrep: <rule>` markers (Semgrep's SARIF
        # keeps them in a form GitHub ignores) and the scoped,
        # justified exceptions listed in the script.  Logs every
        # finding it drops.
        run: python3 .github/semgrep/filter_sarif.py semgrep-raw.sarif semgrep.sarif
      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4.38.2
        with:
          sarif_file: semgrep.sarif
          category: semgrep
