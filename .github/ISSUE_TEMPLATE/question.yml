name: Question / Support
description: Ask a question about using Unkai Mail or get help with setup.
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for usage questions, configuration help, or "is this supposed to work this way?" enquiries.

        **Before submitting:** please check the [README](https://github.com/firn-labs/unkai-mail-mobile/blob/main/README.md) and search [existing issues](https://github.com/firn-labs/unkai-mail-mobile/issues?q=is%3Aissue) — your question may already have been answered.

        If you're hitting an error or something that looks broken, please use the **Bug report** template instead.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checks
      options:
        - label: I have checked the README and searched existing issues for an answer.
          required: true

  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What would you like to know?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: What are you trying to do?
      description: Describe the goal you're working toward — that often lets us suggest a better path than the one you're asking about.
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: Where are you running it?
      options:
        - iPhone (physical device)
        - iPad (physical device)
        - iOS Simulator
        - Desktop window (`npm run dev`)
        - Not applicable / general question
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: Commit / app version
      description: If relevant. The commit you built from (`git rev-parse --short HEAD`); the app version is under Settings → About.
      placeholder: e.g. a1b2c3d (app version 0.1.0)
    validations:
      required: false
