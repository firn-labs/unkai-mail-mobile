<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      `viewport-fit=cover` lets the app paint under the notch and the
      home indicator; the safe-area insets in `app.css` keep content
      out from under them. `maximum-scale=1` blocks the double-tap
      zoom that would otherwise fire on list rows — the message body
      does its own scaling instead.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="color-scheme" content="light dark" />
    <title>Unkai Mail</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
